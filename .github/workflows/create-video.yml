name: Tạo & upload video tech

on:
  # Chạy tự động 2 lần/ngày (giờ UTC).
  #  00:00 UTC = 7h VN  -> SÁNG: video dài (long, ngang 16:9)
  #  12:00 UTC = 19h VN -> TỐI:  video short (dọc 9:16, <60s)
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  # Cho phép chạy tay từ tab Actions
  workflow_dispatch:
    inputs:
      mode:
        description: "Chế độ video (long = dài 16:9, short = dọc 9:16)"
        required: false
        type: choice
        default: "long"
        options:
          - long
          - short
      no_upload:
        description: "Chỉ render, không upload (true/false)"
        required: false
        default: "false"

# Tránh chạy chồng nếu lần trước chưa xong
concurrency:
  group: video-pipeline
  cancel-in-progress: false

jobs:
  create-video:
    runs-on: ubuntu-latest
    # Repo public: Actions miễn phí không giới hạn, để trần cao cho video dài/nhiều ảnh
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cài dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # VieNeu-TTS (cài từ git; nếu lỗi vẫn tiếp tục vì có fallback Edge/ElevenLabs)
          pip install git+https://github.com/pnnbao97/VieNeu-TTS.git || echo "VieNeu-TTS bỏ qua, dùng fallback"

      - name: Cache model Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ runner.os }}

      - name: Xác định mode theo giờ chạy
        id: mode
        run: |
          # Chạy tay: dùng input. Chạy theo lịch: 00:00 UTC = long (sáng), 12:00 UTC = short (tối).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 12 * * *" ]; then
            MODE="short"
          else
            MODE="long"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode đã chọn: $MODE"

      - name: Chạy pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Ảnh đẹp + footage VIDEO b-roll (không có -> tự fallback ảnh tĩnh/Openverse)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "${{ github.event.inputs.no_upload }}" = "true" ]; then
            python -m src.pipeline --mode "$MODE" --no-upload
          else
            python -m src.pipeline --mode "$MODE"
          fi

      - name: Lưu artifact khi test (không upload)
        if: ${{ github.event.inputs.no_upload == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: output/**/*.mp4
          retention-days: 3

      - name: Commit lịch sử DB
        if: ${{ always() }}
        run: |
          git config user.name "video-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f output/state.db || true
          git commit -m "chore: cập nhật lịch sử video [skip ci]" || echo "Không có thay đổi"
          git push || echo "Không push được (bỏ qua)"
