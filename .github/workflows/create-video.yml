name: Tạo & upload video tech

on:
  # 00:00 UTC = 07:00 Việt Nam: cứ 3 ngày tạo 1 video dài.
  # 12:00 UTC = 19:00 Việt Nam: tạo 1 Short mỗi ngày.
  schedule:
    - cron: "0 0 */3 * *"
    - cron: "0 12 * * *"
  # Cho phép chạy tay từ tab Actions
  workflow_dispatch:
    inputs:
      mode:
        description: "Chế độ (documentary = phim tài liệu công nghệ thủ công, tối thiểu 10 phút)"
        required: false
        type: choice
        default: "long"
        options:
          - long
          - short
          - mega
          - documentary
      topic:
        description: "Chủ đề cụ thể; documentary để trống sẽ tự chọn lịch sử/nhân vật/câu chuyện công nghệ"
        required: false
        type: string
        default: ""
      duration:
        description: "Thời lượng mục tiêu theo giây; documentary nhập dưới 600 vẫn tự khóa ở 600"
        required: false
        type: string
        default: ""
      no_upload:
        description: "Chỉ render, không upload (true/false)"
        required: false
        default: "false"

# Tránh chạy chồng nếu lần trước chưa xong
concurrency:
  group: video-pipeline
  cancel-in-progress: false

jobs:
  create-video:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Repo public: Actions miễn phí không giới hạn, để trần cao cho video dài/nhiều ảnh
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Đồng bộ lịch sử mới nhất
        run: git pull --rebase --autostash origin main || echo "không pull được (bỏ qua)"

      - name: Thêm swap chống OOM khi ghép video
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/ci-swapfile
          sudo fallocate -l 12G /mnt/ci-swapfile || sudo dd if=/dev/zero of=/mnt/ci-swapfile bs=1M count=12288
          sudo chmod 600 /mnt/ci-swapfile
          sudo mkswap /mnt/ci-swapfile
          sudo swapon /mnt/ci-swapfile
          free -h

      - name: Cài ffmpeg & dependencies hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-freefont-ttf fonts-liberation fonts-noto-core
          # Phụ thuộc cho manim: cairo/pango để render + LaTeX đầy đủ cho MathTex (toán học, font vector cm-super).
          sudo apt-get install -y \
            libcairo2-dev libpango1.0-dev pkg-config \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended \
            texlive-latex-extra texlive-science cm-super tipa dvisvgm || echo "deps manim bỏ qua, dùng fallback"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cài dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # VieNeu-TTS (cài từ git; nếu lỗi vẫn tiếp tục vì có fallback Edge/ElevenLabs)
          pip install git+https://github.com/pnnbao97/VieNeu-TTS.git || echo "VieNeu-TTS bỏ qua, dùng fallback"
          # Manim production chạy trong image cô lập được build ở bước kế tiếp.

      - name: Build Manim sandbox image
        run: docker build --tag tech-viz-manim:latest docker/manim-worker

      - name: Cache model Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ runner.os }}

      - name: Khôi phục retention feedback riêng của repository
        uses: actions/cache@v4
        with:
          path: output/retention
          key: retention-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            retention-${{ runner.os }}-

      - name: Xác định mode chạy
        id: mode
        run: |
          # Chạy tay: dùng input. Theo lịch: 00:00 UTC = long, 12:00 UTC = short.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 12 * * *" ]; then
            MODE="short"
          else
            MODE="long"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode đã chọn: $MODE"

      - name: Chạy pipeline
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          # HF_TOKEN: thumbnail AI qua HuggingFace FLUX (không có -> fallback Pollinations)
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # VieNeu ONNX dùng external-data; symlink của HF Hub làm .onnx và .data
          # nằm khác thư mục blob -> ONNXRuntime báo "path escapes". Copy file thật.
          HF_HUB_DISABLE_SYMLINKS: "1"
          # Ảnh đẹp + footage VIDEO b-roll (không có -> tự fallback ảnh tĩnh/Openverse)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
          INPUT_DURATION: ${{ github.event.inputs.duration }}
          INPUT_NO_UPLOAD: ${{ github.event.inputs.no_upload }}
          # Khai thác tối đa 100% công suất CPU runner (đa luồng ONNX, PyTorch, NumPy, FFmpeg)
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
          OPENBLAS_NUM_THREADS: "4"
          NUMEXPR_NUM_THREADS: "4"
          PYTHONUNBUFFERED: "1"
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          CMD=("python" "-m" "src.pipeline" "--mode" "$MODE")
          if [ -n "$INPUT_TOPIC" ]; then
            CMD+=("--topic" "$INPUT_TOPIC")
          fi
          if [ -n "$INPUT_DURATION" ]; then
            CMD+=("--duration" "$INPUT_DURATION")
          fi
          if [ "$INPUT_NO_UPLOAD" = "true" ]; then
            CMD+=("--no-upload")
          fi
          echo "Executing: ${CMD[*]}"
          "${CMD[@]}"

      - name: Lưu artifact khi test (không upload)
        if: ${{ github.event.inputs.no_upload == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: |
            output/**/*.mp4
            output/video_*/quality_report.json
            output/video_*/content_quality_report.json
            output/video_*/scene_quality_report.json
            output/video_*/storyboard_plan.json
            output/video_*/run_state.json
            output/video_*/script_quality_report.json
            output/video_*/scene_contact_sheet.jpg
            output/video_*/aivideo_*_frames/*.jpg
            output/video_*/manifest.json
          retention-days: 3

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: output/**/
          retention-days: 3
