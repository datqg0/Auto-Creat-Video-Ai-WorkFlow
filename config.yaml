# Cấu hình pipeline tạo video tech tự động

# Số video tạo mỗi lần chạy pipeline
videos_per_run: 1

# Ngôn ngữ nội dung: vi | en
language: vi

# Độ dài video mục tiêu (giây). ~300 = 5 phút (bị mode ghi đè khi chạy)
target_duration_seconds: 300

# ---- Chế độ video theo buổi ----
# Sáng làm video dài (ngang 16:9), tối làm short (dọc 9:16, tối đa 3 phút / 180s).
# pipeline chọn mode qua --mode; nếu không có thì dùng default_mode.
default_mode: long
modes:
  long:
    target_duration_seconds: 300
    width: 1920
    height: 1080
  short:
    target_duration_seconds: 175   # Tối đa YouTube Shorts cho phép là 3 phút (180s). Đặt 175s để có biên an toàn không bị vượt 180s.
    width: 1080
    height: 1920
  mega:
    target_duration_seconds: 900   # 15 phút (siêu dài, chia chương tự động)
    width: 1920
    height: 1080

# ---- LLM ----
# Chuỗi fallback nhiều tầng: thử provider đầu, lỗi thì rớt sang tầng kế.
#   type          -> bộ gọi: anthropic | gemini | groq | openai
#   api_key_env   -> tên biến môi trường chứa API key (mặc định theo type)
#   base_url      -> endpoint; hỗ trợ ${ENV_VAR} để chèn từ môi trường
#   supports_temperature: false nếu endpoint không nhận 'temperature'
#   retries       -> số lần thử của riêng provider trước khi fallback
llm:
  # ---- Phân chia định tuyến LLM theo từng tác vụ (Task Routing) ----
  tasks:
    # 1. Chọn chủ đề & Tối ưu tiêu đề: Nhanh, nhẹ, đón trend tốt -> Gemini Flash -> Groq Llama
    topic:
      - gemini_37
      - gemini_latest
      - groq
      - groq_fast

    # 2. Viết kịch bản: Giữ chuỗi fallback theo chiều sâu tư duy -> Claude Opus -> Gemini -> Pollinations (DeepSeek) -> Groq
    script:
      - anthropic
      - gemini_37
      - gemini_latest
      - pollinations
      - groq
      - groq_fast
      - openrouter
      - mistral

    # 3. Viết code thuật toán Visual / Animation: DeepSeek-Reasoner (R1) / Qwen Coder / Claude -> fallback Groq -> Gemini
    code:
      - pollinations_coder       # DeepSeek-Reasoner (R1) hoặc Qwen-2.5-Coder qua Pollinations
      - anthropic                # Claude Opus 4.8
      - groq                     # Llama 3.3 70B siêu tốc độ
      - groq_fast
      - gemini_37                # Gemini 3.7 Flash

  providers:
    # Tier 0 — Anthropic (Opus 4.8 qua justwoker.icu — Model suy luận và viết kịch bản mạnh nhất)
    - name: anthropic
      type: anthropic
      model: claude-opus-4-8
      base_url: https://api.justwoker.icu
      api_key_env: ANTHROPIC_API_KEY
      max_output_tokens: 16000
      supports_temperature: false
      stream: false                         # Proxy justwoker không hỗ trợ stream content chunk, tắt stream để nhận đầy đủ văn bản
      timeout: 180
      retries: 2

    # Tier 1.1 — Google Gemini 3.7 Flash (Mạnh nhất dòng Flash, tốc độ cao, context rộng)
    - name: gemini_37
      type: gemini
      model: gemini-3.7-flash
      api_key_env: GEMINI_API_KEY

    # Tier 1.2 — Google Gemini Flash Latest (Dự phòng khi 3.7 chạm quota)
    - name: gemini_latest
      type: gemini
      model: gemini-flash-latest
      api_key_env: GEMINI_API_KEY

    # Tier 2.1 — Pollinations AI Coder (Qwen 3 Coder 30B / DeepSeek V4.1 — Trùm viết code thuật toán & Animation)
    - name: pollinations_coder
      type: openai
      model: qwen/qwen3-coder-30b-a3b-instruct
      base_url: https://gen.pollinations.ai/v1
      api_key_env: POLLINATIONS_API_KEY
      max_output_tokens: 16384

    # Tier 2.2 — Pollinations AI Chat (DeepSeek V4.1 Flash — Suy luận & văn bản)
    - name: pollinations
      type: openai
      model: deepseek/deepseek-v4.1-flash
      base_url: https://gen.pollinations.ai/v1
      api_key_env: POLLINATIONS_API_KEY
      max_output_tokens: 16384

    # Tier 3 — Groq (gpt-oss-120b / qwen3.8-27b — Siêu tốc độ LPU)
    - name: groq
      type: groq
      model: openai/gpt-oss-120b
      api_key_env: GROQ_API_KEY
      max_output_tokens: 32768              # Max lên tới 65k tokens, để 32k cực kỳ rộng rãi

    - name: groq_fast
      type: groq
      model: qwen/qwen3.8-27b
      api_key_env: GROQ_API_KEY
      max_output_tokens: 16384              # Max trần của Qwen trên Groq

    # Tier 3 — OpenRouter (free models, tương thích OpenAI)
    - name: openrouter
      type: openai
      model: meta-llama/llama-3.3-70b-instruct:free
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      max_output_tokens: 16384
      headers:
        HTTP-Referer: https://github.com/datqg0/Auto-Creat-Video-Ai-WorkFlow
        X-Title: Auto Video AI

    # Tier 3.5 — Z.ai GLM Flash (tương thích Anthropic SDK)
    - name: zai
      type: anthropic
      model: glm-4-flash
      base_url: https://api.z.ai/api/anthropic
      api_key_env: ZAI_API_KEY
      max_output_tokens: 8192
      supports_temperature: true

    # Tier 4 — Mistral (tương thích OpenAI)
    - name: mistral
      type: openai
      model: mistral-large-latest
      base_url: https://api.mistral.ai/v1
      api_key_env: MISTRAL_API_KEY
      max_output_tokens: 16384

    # Tier 4.5 — NVIDIA NIM (tương thích OpenAI)
    - name: nvidia
      type: openai
      model: meta/llama-3.3-70b-instruct
      base_url: https://integrate.api.nvidia.com/v1
      api_key_env: NVIDIA_API_KEY
      max_output_tokens: 8192

    # Tier 5 — free, không cần thẻ (tương thích OpenAI). Bật cái nào có key.
    - name: github_models
      type: openai
      model: gpt-4o-mini
      base_url: https://models.inference.ai.azure.com
      api_key_env: GITHUB_MODELS_TOKEN
      max_output_tokens: 16384
    - name: sambanova
      type: openai
      model: Meta-Llama-3.3-70B-Instruct
      base_url: https://api.sambanova.ai/v1
      api_key_env: SAMBANOVA_API_KEY
      max_output_tokens: 8192
    - name: cloudflare
      type: openai
      model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      # ${CF_ACCOUNT_ID} được thay từ env lúc chạy
      base_url: https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai/v1
      api_key_env: CLOUDFLARE_API_TOKEN
      max_output_tokens: 8192

  temperature: 0.9
  max_retries: 2

# ---- TTS ----
tts:
  # Thứ tự fallback: vieneu -> edge (đã TẠM BỎ elevenlabs)
  providers:
    - vieneu
    - edge
  vieneu:
    # Giọng preset của VieNeu-TTS v3 Turbo. Nam: "Minh Quân Pro", "Anh Khôi", "Thái Sơn".
    voice: "Minh Quân Pro"
    mode: v3turbo   # v3turbo (48kHz, chất lượng cao) | v3nano (nhanh, máy yếu)
    speed: 0.95     # Tốc độ đọc điềm tĩnh, dễ hiểu
  elevenlabs:
    voice_id: "pNInz6obpgDQGcFmaJgB"  # Adam (giọng nam). Nữ Rachel: 21m00Tcm4TlvDq8ikWAM
    model: eleven_multilingual_v2
  edge:
    # Giọng NAM tiếng Việt của Edge (NamMinh). Nữ: vi-VN-HoaiMyNeural
    voice_vi: "vi-VN-NamMinhNeural"
    voice_en: "en-US-GuyNeural"
    rate: "-6%"     # Giảm 6% tốc độ đọc để nhịp video chậm rãi, người xem kịp hiểu
    pitch: "+0Hz"
  # Khoảng nghỉ tự nhiên giữa các câu (giây) giúp nhịp video thở được, không bị dồn dập
  sentence_pause: 0.25

# ---- Visual ----
visual:
  width: 1920
  height: 1080
  fps: 30
  # Tỉ lệ scene: bao nhiêu % dùng loại nào (pipeline tự quyết dựa trên nội dung)
  background_color: "#0d1117"
  accent_color: "#58a6ff"
  # Font hỗ trợ đầy đủ dấu tiếng Việt
  font: "assets/fonts/BeVietnamPro-Bold.ttf"
  font_regular: "assets/fonts/BeVietnamPro-Regular.ttf"
  # Thời gian chuyển cảnh crossfade giữa các scene (giây)
  crossfade: 0.4

# ---- Animation code do AI viết ----
animation:
  enabled: true
  ai_code_primary: true        # Ưu tiên AI sinh code Python (Matplotlib / Manim) cho animation
  animate_from_start: true     # Scene 1 (Hook) luôn mở đầu bằng animation động do code AI vẽ
  min_animation_ratio: 0.70    # Tối thiểu 70% số scene dùng animation
  # Cho phép LLM viết code manim (đẹp hơn matplotlib nhưng nặng: cần LaTeX + cairo).
  # Nếu manim chưa cài / render lỗi -> tự fallback về pycode (matplotlib) rồi custom spec.
  manim_enabled: true
  # Chất lượng render manim: low_quality|medium_quality|high_quality|production_quality
  manim_quality: "medium_quality"
  # FPS riêng cho manim (30 fps đồng bộ visual.fps để render nhanh hơn trên CI).
  manim_fps: 30
  # Timeout cứng cho 1 lần render manim (giây); vượt -> bỏ, fallback.
  manim_timeout: 300

# ---- Ảnh minh họa tự tìm ----
images:
  # Tự tìm & tải ảnh nền minh họa theo image_query của mỗi scene.
  # Nguồn: Openverse (không cần key). Đặt PEXELS_API_KEY để dùng Pexels (đẹp hơn).
  enabled: true

# ---- Video b-roll tự tìm ----
videos:
  # Tải footage VIDEO thật (Pexels Videos) theo video_query của mỗi scene, dùng
  # làm nền động + chữ overlay -> trực quan, sinh động hơn ảnh tĩnh.
  # CẦN PEXELS_API_KEY (không có key -> tự động fallback về ảnh tĩnh).
  enabled: true
  max_per_video: 6        # số scene tối đa dùng b-roll trong 1 video

# ---- Thumbnail AI (phong cách Kurzgesagt) ----
thumbnail:
  engine: "ai"                      # "ai" (ưu tiên AI nền + chữ trái) | "svg" (Edge headless)
  ai_enabled: true
  layout: "split_left_text"         # Chữ bên trái, ảnh bên phải
  text_ratio: 0.40                  # Cột chữ chiếm 40% (0 -> 512px)
  gradient_ratio: 0.05              # Dải chuyển màu 5% (~64px)
  canvas: [1280, 720]
  # Nguồn chính: HuggingFace FLUX.1-schnell (đẹp, không logo, free-tier). Cần HF_TOKEN.
  hf_model: "black-forest-labs/FLUX.1-schnell"
  pollinations_fallback: true       # HF lỗi/cold -> Pollinations Flux (không cần key)
  gemini_fallback: false            # bật nếu bạn đã mở billing cho Gemini image
  model: "gemini-2.5-flash-image"   # chỉ dùng khi gemini_fallback: true
  style: kurzgesagt

# ---- Subtitles ----
subtitles:
  enabled: true
  whisper_model: "base"   # (chỉ dùng khi fallback Whisper) tiny|base|small|medium
  burn_in: false          # false: video sạch, upload file srt lên YouTube để người dùng bật CC nếu cần

# ---- Nhạc nền ----
music:
  enabled: true
  directory: "assets/music"
  volume: 0.12            # âm lượng nhạc nền so với narration

# ---- Hiệu ứng âm thanh chuyển cảnh ----
sfx:
  enabled: true
  directory: "assets/sfx"  # đặt file whoosh .mp3/.wav vào đây
  volume: 0.3

# ---- Intro / Outro ----
branding:
  intro: "assets/branding/intro.mp4"
  outro: "assets/branding/outro.mp4"
  enabled: false          # bật khi đã có file intro/outro

# ---- YouTube ----
youtube:
  privacy_status: public   # public | unlisted | private
  category_id: "28"        # 28 = Science & Technology
  default_tags:
    - technology
    - programming
    - tech explained
    - "công nghệ"
  made_for_kids: false

# ---- Chủ đề ----
topics:
  # Lĩnh vực để AI chọn chủ đề (tránh lan man)
  domains:
    - "trí tuệ nhân tạo và machine learning"
    - "thuật toán và cấu trúc dữ liệu"
    - "kiến trúc hệ thống và distributed systems"
    - "ngôn ngữ lập trình và paradigm"
    - "an ninh mạng và mã hóa"
    - "blockchain và cryptography"
    - "phần cứng, GPU, kiến trúc máy tính"
    - "database và big data"
  # So ngay tranh lap lai chu de da dung
  dedup_days: 30

# ---- Trending signals ----
trend:
  # Bat/tat thu thap tin hieu trending (HackerNews, Reddit, Google Trends).
  # Tat khi chay offline hoac mang khong on dinh.
  enabled: true
  # Cache ket qua bao nhieu tieng truoc khi goi mang lai (mac dinh 6h).
  cache_hours: 6
  # So tin hieu toi da nhet vao prompt LLM (qua nhieu lam loang ngon canh).
  max_signals: 18
  # Nguon muon bat/tat rieng
  sources:
    hacker_news: true
    reddit: true
    google_trends: true   # can: pip install pytrends
