# Cấu hình pipeline tạo video tech tự động

# Số video tạo mỗi lần chạy pipeline
videos_per_run: 1

# Ngôn ngữ nội dung: vi | en
language: vi

# Độ dài video mục tiêu (giây). ~300 = 5 phút (bị mode ghi đè khi chạy)
target_duration_seconds: 300

# Giới hạn ký tự tài liệu nghiên cứu đưa vào prompt kịch bản
research_max_chars: 1800

# ---- Chế độ video ----
# Lịch GitHub tự động chạy Short hằng ngày và long 3 ngày/lần.
# Mega và documentary chỉ chạy khi được chọn thủ công trong workflow_dispatch.
default_mode: long
modes:
  long:
    target_duration_seconds: 300
    width: 1920
    height: 1080
    focus: "ai_deep_ml"            # Video dài chuyên sâu AI & Machine Learning từ số 0 (Deep-ML)
  short:
    target_duration_seconds: 60    # 60s Shorts: đa dạng thuật toán, cấu trúc dữ liệu, mô phỏng & toán trực quan
    width: 1080
    height: 1920
    style: "onjsdev"
  mega:
    target_duration_seconds: 900   # 15 phút chuyên sâu toàn diện AI từ số 0
    width: 1920
    height: 1080
    focus: "ai_deep_ml"
  documentary:
    target_duration_seconds: 720   # Mặc định 12 phút, pipeline khóa sàn 10 phút
    min_duration_seconds: 600
    width: 1920
    height: 1080
    focus: "technology_documentary"
    words_per_minute: 115          # Nhịp kể chậm, có khoảng thở
    research_max_chars: 6000       # Cần đủ dữ kiện lịch sử, con người và mốc thời gian
    tts:
      vieneu_speed: 0.82
      edge_rate: "-18%"
      sentence_pause: 0.45
    animation:
      animate_from_start: false
      max_animation_ratio: 0.20

# ---- LLM ----
# Chuỗi fallback nhiều tầng: thử provider đầu, lỗi thì rớt sang tầng kế.
#   type          -> bộ gọi: anthropic | gemini | groq | openai
#   api_key_env   -> tên biến môi trường chứa API key (mặc định theo type)
#   base_url      -> endpoint; hỗ trợ ${ENV_VAR} để chèn từ môi trường
#   supports_temperature: false nếu endpoint không nhận 'temperature'
#   retries       -> số lần thử của riêng provider trước khi fallback
llm:
  # ---- Phân chia định tuyến LLM theo từng tác vụ (Task Routing) ----
  tasks:
    # 1. Chọn chủ đề & Tối ưu tiêu đề: Nhanh, nhẹ, 1-2s -> Groq Fast -> Groq -> Gemini -> GitHub Models
    topic:
      - groq_fast
      - groq
      - cerebras
      - github_models
      - gemini_38
      - gemini_37

    # 2. Viết kịch bản: Gemini 3.8/3.7 -> GitHub Models -> Cerebras -> OpenRouter
    # (Tránh đưa Groq vào script vì Groq có OTPM limit 1000 và max token nhỏ, dễ làm hỏng JSON)
    script:
      - gemini_38
      - gemini_37
      - gemini_latest
      - github_models
      - cerebras
      - openrouter

    # 3. Viết code thuật toán Visual / Animation: Cerebras (siêu tốc, 1M token free/ngày) -> Groq LPU -> Gemini -> GitHub Models
    # (Ưu tiên Cerebras/Groq trước để TIẾT KIỆM quota 20 req/ngày của Gemini cho kịch bản)
    code:
      - cerebras                 # Llama 3.3 70B qua Cerebras siêu tốc (1800+ tokens/giây, 1M tokens free/ngày)
      - groq                     # LPU Llama 3.3 70B siêu tốc độ
      - github_models            # GPT-4o-mini qua GitHub Models
      - gemini_38                # Gemini 3.8 Flash
      - gemini_37                # Gemini 3.7 Flash


  providers:
    # Tier 1.0 — Google Gemini 3.8 Flash (Model mới nhất, cực nhanh, context rộng)
    - name: gemini_38
      type: gemini
      model: gemini-3.8-flash
      api_key_env: GEMINI_API_KEY
      timeout: 120

    # Tier 1.1 — Google Gemini 3.7 Flash (Mạnh dòng Flash, tốc độ cao)
    - name: gemini_37
      type: gemini
      model: gemini-3.7-flash
      api_key_env: GEMINI_API_KEY
      timeout: 120

    # Tier 1.2 — Google Gemini Flash Latest (Dự phòng khi 3.8/3.7 chạm quota)
    - name: gemini_latest
      type: gemini
      model: gemini-flash-latest
      api_key_env: GEMINI_API_KEY
      timeout: 120

    # Tier 2.1 — Groq LPU (Các model khả dụng trên tài khoản: gpt-oss-120b, qwen3.8-27b, gpt-oss-20b — Giới hạn 8K TPM)
    - name: groq
      type: groq
      model: openai/gpt-oss-120b
      api_key_env: GROQ_API_KEY
      max_output_tokens: 2000
      timeout: 60

    - name: groq_fast
      type: groq
      model: qwen/qwen3.8-27b
      api_key_env: GROQ_API_KEY
      max_output_tokens: 950
      timeout: 45

    - name: groq_20b
      type: groq
      model: openai/gpt-oss-20b
      api_key_env: GROQ_API_KEY
      max_output_tokens: 2000
      timeout: 45

    # Tier 2.2 — Cerebras Cloud (Qwen 3.8 27B: https://inference-docs.cerebras.ai/models/qwen-3.8-27b)
    - name: cerebras
      type: openai
      model: qwen-3.8-27b
      base_url: https://api.cerebras.ai/v1
      api_key_env: CEREBRAS_API_KEY
      max_output_tokens: 8192
      timeout: 45

    # Tier 2.3 — OpenRouter (Free models router dynamic)
    - name: openrouter
      type: openai
      model: openrouter/free
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      max_output_tokens: 8192
      timeout: 60
      headers:
        HTTP-Referer: https://github.com/datqg0/Auto-Creat-Video-Ai-WorkFlow
        X-Title: Auto Video AI

    # Tier 3.1 — Pollinations AI Coder (Qwen 3 Coder 30B / DeepSeek V4.1 — Trùm viết code thuật toán & Animation)
    - name: pollinations_coder
      type: openai
      model: qwen/qwen3-coder-30b-a3b-instruct
      base_url: https://gen.pollinations.ai/v1
      api_key_env: POLLINATIONS_API_KEY
      max_output_tokens: 16384
      timeout: 60

    # Tier 3.2 — Pollinations AI Chat (DeepSeek V4.1 Flash — Suy luận & văn bản)
    - name: pollinations
      type: openai
      model: deepseek/deepseek-v4.1-flash
      base_url: https://gen.pollinations.ai/v1
      api_key_env: POLLINATIONS_API_KEY
      max_output_tokens: 16384
      timeout: 60

    # Tier 3.5 — Z.ai GLM Flash (tương thích Anthropic SDK)
    - name: zai
      type: anthropic
      model: glm-4-flash
      base_url: https://api.z.ai/api/anthropic
      api_key_env: ZAI_API_KEY
      max_output_tokens: 8192
      supports_temperature: true

    # Tier 4 — Mistral (tương thích OpenAI)
    - name: mistral
      type: openai
      model: mistral-large-latest
      base_url: https://api.mistral.ai/v1
      api_key_env: MISTRAL_API_KEY
      max_output_tokens: 16384

    # Tier 4.5 — NVIDIA NIM (tương thích OpenAI)
    - name: nvidia
      type: openai
      model: meta/llama-3.3-70b-instruct
      base_url: https://integrate.api.nvidia.com/v1
      api_key_env: NVIDIA_API_KEY
      max_output_tokens: 8192

    # Tier 5 — free, không cần thẻ (tương thích OpenAI). Bật cái nào có key.
    - name: github_models
      type: openai
      model: gpt-4o-mini
      base_url: https://models.github.ai/inference
      api_key_env: GH_MODELS_TOKEN
      max_output_tokens: 16384
    - name: sambanova
      type: openai
      model: Meta-Llama-3.3-70B-Instruct
      base_url: https://api.sambanova.ai/v1
      api_key_env: SAMBANOVA_API_KEY
      max_output_tokens: 8192
    - name: cloudflare
      type: openai
      model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      # ${CF_ACCOUNT_ID} được thay từ env lúc chạy
      base_url: https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai/v1
      api_key_env: CLOUDFLARE_API_TOKEN
      max_output_tokens: 8192

  temperature: 0.9
  max_retries: 2

# ---- TTS ----
tts:
  # Thứ tự fallback: vieneu -> edge (đã TẠM BỎ elevenlabs)
  providers:
    - vieneu
    - edge
  vieneu:
    # Giọng preset của VieNeu-TTS v3 Turbo. Nam: "Minh Quân Pro", "Anh Khôi", "Thái Sơn".
    voice: "Minh Quân Pro"
    mode: v3turbo   # v3turbo (48kHz, chất lượng cao) | v3nano (nhanh, máy yếu)
    speed: 0.90     # Tốc độ đọc điềm tĩnh, dễ hiểu (FIX-03/FIX-17)
  elevenlabs:
    voice_id: "pNInz6obpgDQGcFmaJgB"  # Adam (giọng nam). Nữ Rachel: 21m00Tcm4TlvDq8ikWAM
    model: eleven_multilingual_v2
  edge:
    # Giọng NAM tiếng Việt của Edge (NamMinh). Nữ: vi-VN-HoaiMyNeural
    voice_vi: "vi-VN-NamMinhNeural"
    voice_en: "en-US-GuyNeural"
    rate: "-10%"    # Giảm 10% tốc độ đọc để nhịp video chậm rãi, người xem kịp hiểu (FIX-03/FIX-17)
    pitch: "+0Hz"
  # Khoảng nghỉ tự nhiên giữa các câu (giây) giúp nhịp video thở được, không bị dồn dập
  sentence_pause: 0.25

# ---- Visual ----
visual:
  width: 1920
  height: 1080
  fps: 30
  # Tỉ lệ scene: bao nhiêu % dùng loại nào (pipeline tự quyết dựa trên nội dung)
  background_color: "#0d1117"
  accent_color: "#58a6ff"
  # Font hỗ trợ đầy đủ dấu tiếng Việt
  font: "assets/fonts/BeVietnamPro-Bold.ttf"
  font_regular: "assets/fonts/BeVietnamPro-Regular.ttf"
  typography:
    heading_min_horizontal: 36
    heading_min_vertical: 42
    body_horizontal: 36
    body_vertical: 42
    overlay_min_horizontal: 40
    overlay_min_vertical: 46
    subtitle_horizontal: 40
    subtitle_vertical: 52
    motion_subtitle_horizontal: 38
    motion_subtitle_vertical: 36
  # Thời gian chuyển cảnh crossfade giữa các scene (giây)
  crossfade: 0.4

# ---- Animation code do AI viết ----
animation:
  enabled: true
  ai_code_primary: true        # Ưu tiên AI sinh code Python (Matplotlib / Manim) cho animation
  animate_from_start: true     # Scene 1 (Hook) luôn mở đầu bằng animation động do code AI vẽ
  min_animation_ratio: 0.55    # Mốc tham khảo cho báo cáo; không ép cảnh thành animation
  motion_graphics_enabled: true # Bật engine Motion Graphics HTML5/Canvas qua Edge Headless (chuẩn Tech Studio)
  manim_enabled: true          # Bật Manim cho các scene thuật toán sâu (chuẩn 3Blue1Brown)
  # Chất lượng render manim: high_quality cho độ nét 1080p tối đa
  manim_quality: "high_quality"
  # FPS riêng cho manim (30 fps đồng bộ visual.fps để render mượt mà trên CI).
  manim_fps: 30
  # Timeout cứng cho 1 lần render manim (giây); nâng lên 480s để scene phức tạp render trọn vẹn.
  manim_timeout: 480

# ---- Ảnh minh họa (Tự tìm & AI sinh) ----
images:
  # Tự tìm & tải ảnh nền minh họa theo image_query của mỗi scene.
  # Nguồn: Openverse, Google, DuckDuckGo, Pexels.
  enabled: true
  ai_enabled: true                # Tự động sinh ảnh AI minh họa đúng chủ đề khi stock photo không tìm thấy
  ai_primary: false               # false: tìm stock trước rồi fallback AI; true: luôn ưu tiên ảnh AI gen
  ai_provider: "pollinations"     # pollinations (FLUX 100% Free, không cần key) | huggingface | gemini
  ai_style: "kurzgesagt"          # kurzgesagt | blueprint | realistic

# ---- Video b-roll footage Pexels ----
videos:
  # Tải footage VIDEO thật (Pexels Videos) theo video_query của mỗi scene, dùng
  # làm nền động + chữ overlay -> trực quan, sinh động hơn ảnh tĩnh.
  # CẦN PEXELS_API_KEY (không có key -> tự động fallback về ảnh tĩnh/AI video).
  enabled: true
  max_per_video: 10       # mở rộng số scene tối đa dùng b-roll trong 1 video (từ 6 lên 10)

# ---- Video AI sinh từ nhiều ảnh / video diffusion ----
ai_video:
  enabled: true
  max_per_run: 2                  # Tối đa 2 cảnh dùng clip AI mỗi video
  images_per_clip: 3             # ai_motion sinh 3 ảnh/cảnh, pan/zoom và chuyển mềm
  provider: "ai_motion"           # ai_motion (0đ, không cần key, tức thì) | fal | pollinations
  duration: 5.0                   # Thời lượng clip AI sinh ra (giây)
  fal_model: "fal-ai/wan/v2.1/text-to-video" # Model diffusion nếu dùng Fal.ai (cần FAL_KEY)
  pollinations_model: "alibaba/wan-2.2-fast" # Model nếu dùng Pollinations Video

# ---- Thumbnail AI (phong cách Kurzgesagt) ----
thumbnail:
  engine: "ai"                      # "ai" (ưu tiên AI nền + chữ trái) | "svg" (Edge headless)
  ai_enabled: true
  layout: "split_left_text"         # Chữ bên trái, ảnh bên phải
  text_ratio: 0.40                  # Cột chữ chiếm 40% (0 -> 512px)
  gradient_ratio: 0.05              # Dải chuyển màu 5% (~64px)
  canvas: [1280, 720]
  # Nguồn chính: HuggingFace FLUX.1-schnell (đẹp, không logo, free-tier). Cần HF_TOKEN.
  hf_model: "black-forest-labs/FLUX.1-schnell"
  pollinations_fallback: true       # HF lỗi/cold -> Pollinations Flux (không cần key)
  gemini_fallback: false            # bật nếu bạn đã mở billing cho Gemini image
  model: "gemini-2.5-flash-image"   # chỉ dùng khi gemini_fallback: true
  style: kurzgesagt

# ---- Subtitles ----
subtitles:
  enabled: true           # Vẫn sinh file .srt (tiếng Việt & tiếng Anh) để upload CC lên YouTube
  whisper_model: "base"   # (chỉ dùng khi fallback Whisper) tiny|base|small|medium
  burn_in: false          # false: không in đè phụ đề chữ vào khung hình video (chỉ dùng file .srt rời)

# ---- Kiểm định chất lượng trước upload ----
quality_control:
  enabled: true
  fail_on_warnings: false
  min_file_bytes: 50000
  duration_tolerance_seconds: 2.0
  probe_timeout_seconds: 900
  scan_black_and_freeze: true
  visual_scan_timeout_seconds: 1800
  max_static_scene_ratio: 0.55
  max_caption_chars_per_second: 22
  max_caption_chars_horizontal: 48
  max_caption_chars_vertical: 32

# ---- Fact-check nhẹ, chỉ tra kho offline; không tìm web ----
fact_check:
  enabled: true
  offline_only: true
  max_prompt_chars: 1600

# ---- Nhạc nền ----
music:
  enabled: true
  directory: "assets/music"
  volume: 0.12            # âm lượng nhạc nền so với narration

# ---- Hiệu ứng âm thanh chuyển cảnh ----
sfx:
  enabled: true
  directory: "assets/sfx"  # đặt file whoosh .mp3/.wav vào đây
  volume: 0.3

# ---- Branding & Watermark ----
branding:
  intro: "assets/branding/intro.mp4"
  outro: "assets/branding/outro.mp4"
  enabled: false          # bật khi đã có file intro/outro
  watermark:
    enabled: true         # bật watermark nhận diện thương hiệu
    text: "TECH LAB | AI" # tên kênh / studio hiển thị góc màn hình

# ---- YouTube ----
youtube:
  privacy_status: public   # public | unlisted | private
  category_id: "28"        # 28 = Science & Technology
  default_tags:
    - technology
    - programming
    - tech explained
    - "công nghệ"
  made_for_kids: false

# ---- Phản hồi retention từ YouTube Analytics ----
analytics:
  enabled: true
  lookback_days: 28
  wait_after_publish_days: 3
  refresh_after_days: 7
  min_views_for_guidance: 100
  recent_videos_to_check: 12
  retention_dir: "output/retention"

# ---- Chủ đề ----
topics:
  # Lĩnh vực bao quát để AI tự do sáng tạo và chọn chủ đề phong phú, không bị lặp lại
  domains:
    # 1. TRÍ TUỆ NHÂN TẠO & DEEP LEARNING TỪ SỐ 0 (AI & Deep-ML from Scratch - Trọng tâm Video Dài)
    - "Trí tuệ nhân tạo & Deep Learning từ số 0 (Deep-ML & AI from Scratch: Attention Mechanism, Transformer, Neural Networks, CNN, Loss Functions, Gradient Descent, Backpropagation, Adam Optimizer, K-Means, PCA, Softmax Regression)"

    # 2. THUẬT TOÁN TRỰC QUAN & KỲ QUAN TOÁN HỌC (onjsdev Shorts Style - Trọng tâm Video Ngắn)
    - "Thuật toán trực quan & Tư duy logic (Shorts: Binary Search, Two Pointers, Sorting, BFS/DFS, A*/Dijkstra, Trie, Stack/Queue, Dynamic Programming, Boids, Game of Life, Pi & Fractals)"

    # 3. LẬP TRÌNH ĐỒ HỌA & SHADERS (Graphic Programming)
    - "Lập trình đồ họa & Shaders (Graphic Programming: Ray Tracing, Rasterization, Pixel & Vertex Shaders, Signed Distance Functions SDF, Raymarching, Voxel engines, Compute Shaders mô phỏng hạt, Render Pipeline, WebGPU/OpenGL)"

    # 4. PHẦN CỨNG MÁY TÍNH & CÔNG NGHỆ BÁN DẪN (Hardware & Silicon)
    - "Phần cứng máy tính & Bán dẫn (Hardware: Bóng bán dẫn Transistor, Cổng logic số, CPU đa nhân & chu kỳ lệnh, Cache L1/L2/L3, Băng thông RAM, Kiến trúc GPU vs CPU, Chip bán dẫn 3nm & máy quang khắc ASML, Ổ SSD vs HDD, Cảm biến ảnh CMOS)"

    # 5. MÃ HÓA & AN TOÀN SỐ (Cryptography & Security)
    - "Mã hóa & An toàn số (Cryptography: Trao đổi khóa Diffie-Hellman pha màu, Mã hóa bất đối xứng RSA & số nguyên tố khổng lồ, Hàm băm một chiều SHA-256, Bằng chứng không tiết lộ tri thức Zero-Knowledge Proofs, Giấu tin trong ảnh Steganography, Chữ ký số điện tử & HTTPS)"

    # 6. ĐỒ HỌA MÁY TÍNH & THỊ GIÁC (Computer Graphics & Visual Computing)
    - "Đồ họa máy tính & Thị giác (Computer Graphics: Đường cong Bézier trong vector & font chữ, Thuật toán khử răng cưa Anti-Aliasing/DLSS, Chiếu sáng vật lý PBR, Không gian màu RGB/CMYK/HDR, Occlusion Culling, Đổ bóng Shadow Mapping, Ma trận biến đổi không gian 3D)"

    # 7. NGHỆ THUẬT CỦA TOÁN HỌC & MÔ PHỎNG TỰ NHIÊN (Art of Math & Simulation)
    - "Nghệ thuật của Toán học & Mô phỏng (Art of Math: Tập hợp Fractal Mandelbrot & Julia, Trò chơi cuộc sống Conway Game of Life, Biến đổi Fourier vẽ tranh bằng vòng tròn quay, Biểu đồ Voronoi trong tự nhiên, Tỷ lệ vàng Fibonacci, Hình học Tôpô Topology, Thuyết hỗn loạn Chaos Theory & Hấp dẫn tử lạ)"

    # 8. CÔNG NGHỆ ĐỜI SỐNG & INTERNET CĂN BẢN (Everyday Tech & Internet Mysteries)
    - "Công nghệ đời sống & Internet căn bản (Everyday Tech: Bí mật mã QR tự sửa lỗi Reed-Solomon, Cáp quang biển xuyên đại dương, Định vị GPS & Thuyết tương đối Einstein, Sóng Wifi vs Lò vi sóng 2.4GHz, Chai pin Lithium & sạc nhanh, Chế độ ẩn danh Incognito, Nén ảnh JPEG & MP3, Nhiếp ảnh điện toán)"

    # 9. CÁC NGÔN NGỮ LẬP TRÌNH & SO SÁNH ĐỐI ĐẦU (Programming Languages & Showdowns)
    - "Ngôn ngữ lập trình & Cuộc chiến hiệu năng (Programming Languages: Rust vs C++, Tại sao Python chậm hơn C 100 lần, JavaScript V8 Engine & JIT Compiler, Go Goroutines vs Java Threads, Cơ chế dọn rác Garbage Collector vs Borrow Checker, Assembly vs C, Con trỏ Pointer trong C, Functional Programming Haskell/Lisp)"

  # Chỉ dùng khi chọn mode documentary thủ công trong GitHub Actions.
  documentary_domains:
    - "Lịch sử công nghệ: nguồn gốc Internet, transistor, vi xử lý, điện thoại, GPS, Wi-Fi, mã nguồn mở, AI và những bước ngoặt đã thay đổi xã hội"
    - "Chân dung người làm công nghệ: Ada Lovelace, Alan Turing, Grace Hopper, Claude Shannon, Gordon Moore, Margaret Hamilton, Dennis Ritchie, Steve Wozniak, Radia Perlman, Hedy Lamarr"
    - "Câu chuyện bên lề ngành công nghệ: sản phẩm thất bại, cuộc chiến định dạng, những quyết định suýt phá sản công ty, tiêu chuẩn ít người biết và các phát minh bị lãng quên"
    - "Công nghệ và con người: văn hóa hacker, quyền riêng tư, lao động số, thiết kế gây nghiện, cộng đồng mã nguồn mở, khoảng cách số và tác động môi trường"
    - "Hạ tầng vô hình của đời sống số: cáp quang biển, trung tâm dữ liệu, vệ tinh, đồng hồ nguyên tử, chuỗi cung ứng chip, tên miền và các giao thức giữ Internet hoạt động"

  # Số ngày tránh lặp lại chủ đề đã dùng
  dedup_days: 30
  # Luân phiên đa dạng giữa các nhóm lĩnh vực (0 đến 8)
  priority_domains_every_n: 1
  priority_domain_indices: [0, 1, 2, 3, 4, 5, 6, 7, 8]

# ---- Trending signals ----
trend:
  # Bat/tat thu thap tin hieu trending (HackerNews, Reddit, Google Trends).
  # Tat khi chay offline hoac mang khong on dinh.
  enabled: true
  # Cache ket qua bao nhieu tieng truoc khi goi mang lai (mac dinh 6h).
  cache_hours: 6
  # So tin hieu toi da nhet vao prompt LLM (qua nhieu lam loang ngon canh).
  max_signals: 18
  # Nguon muon bat/tat rieng
  sources:
    hacker_news: true
    reddit: true
    google_trends: true   # can: pip install pytrends

# ---- Quản lý Chuỗi Video (Series Engine) ----
series:
  enabled: true
  default_episodes: 5
  short_episodes: 5     # Số tập cho mỗi chuỗi Shorts (60-180s, dọc 9:16)
  long_episodes: 5      # Số tập cho mỗi chuỗi Video Dài (5-15p, ngang 16:9)

# ---- Nghiên cứu tài liệu khoa học & thực nghiệm (Research & Fact-checking Engine) ----
research:
  enabled: false             # Đã tắt/xóa bỏ ref theo yêu cầu người dùng (giảm bloat prompt, tránh 504 và rate limit)
  max_chars: 4000            # Giới hạn ký tự tài liệu đưa vào prompt
  cache_enabled: true
  cache_dir: "assets/cache/research"
  # 3 tầng fallback:
  #   tier1_auto_search: Tự động tìm & tải trên mạng (Wikipedia, DuckDuckGo, ArXiv, TinyFish)
  #   tier2_backup_link: Tải từ danh sách link backup uy tín trong assets/docs/sources.yaml
  #   tier3_offline_doc: Sử dụng kho tài liệu chuẩn bị sẵn offline trong assets/docs/
  fallback_tiers:
    - auto_search
    - backup_links
    - offline_docs
  enforce_strict_accuracy: true # Bắt buộc kịch bản và animation phải bám sát công thức/số liệu thật
